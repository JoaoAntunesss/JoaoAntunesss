<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" font-family="'Fira Code','JetBrains Mono',Consolas,'SFMono-Regular',monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2ea043"/><stop offset="0.5" stop-color="#58a6ff"/><stop offset="1" stop-color="#bc8cff"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <style>
    @keyframes show { to { opacity:1 } }
    @keyframes type { to { width:520px } }
    @keyframes blink { 50% { opacity:0 } }
.c1{opacity:0;animation:show .01s 0.4s forwards}
.k1{animation:type .9s steps(24,end) 0.4s forwards;width:0}
.o1{opacity:0;animation:show .01s 1.5s forwards}
.c2{opacity:0;animation:show .01s 2.6s forwards}
.k2{animation:type .9s steps(24,end) 2.6s forwards;width:0}
.o2{opacity:0;animation:show .01s 3.7s forwards}
.c3{opacity:0;animation:show .01s 4.8s forwards}
.k3{animation:type .9s steps(24,end) 4.8s forwards;width:0}
.o3{opacity:0;animation:show .01s 5.9s forwards}
    .cur{animation:blink 1s steps(1) infinite}
  </style>
  <rect x="20" y="20" width="960" height="340" rx="18" fill="url(#glow)" opacity=".35" filter="url(#soft)"/>
  <rect x="24" y="24" width="952" height="332" rx="16" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <rect x="24" y="24" width="952" height="44" rx="16" fill="#161b22"/>
  <rect x="24" y="52" width="952" height="16" fill="#161b22"/>
  <circle cx="54" cy="46" r="7" fill="#ff5f56"/><circle cx="78" cy="46" r="7" fill="#ffbd2e"/><circle cx="102" cy="46" r="7" fill="#27c93f"/>
  <text x="500" y="52" fill="#8b949e" font-size="15" text-anchor="middle">joao@cockpit: ~</text>
  <g>
    <clipPath id="cp1"><rect class="k1" x="64" y="96" height="30"/></clipPath>
    <text class="c1" clip-path="url(#cp1)" x="64" y="118" fill="#7ee787" font-size="22">$ whoami</text>
    <text class="o1" x="64" y="148" fill="#e6edf3" font-size="26" font-weight="700">João Antunes · Software Engineering student</text>
  </g>
  <g>
    <clipPath id="cp2"><rect class="k2" x="64" y="178" height="30"/></clipPath>
    <text class="c2" clip-path="url(#cp2)" x="64" y="200" fill="#7ee787" font-size="22">$ cat stack.txt</text>
    <text class="o2" x="64" y="230" fill="#e6edf3" font-size="26" font-weight="700">C  ·  Java  ·  Python  ·  Kotlin</text>
  </g>
  <g>
    <clipPath id="cp3"><rect class="k3" x="64" y="260" height="30"/></clipPath>
    <text class="c3" clip-path="url(#cp3)" x="64" y="282" fill="#7ee787" font-size="22">$ ./build cockpit</text>
    <text class="o3" x="64" y="312" fill="#e6edf3" font-size="26" font-weight="700">Android · Jetpack Compose · Firebase</text>
  </g>
  <rect class="cur" x="64" y="330" width="14" height="5" fill="#7ee787"/>
  <rect x="24" y="352" width="952" height="4" fill="url(#glow)"/>
</svg>
